<script>
const img = document.getElementById('shot');
const btns = ['b100', 'bfit', 'b50', 'b25'].map(i => document.getElementById(i));
function setScale(px) {
  img.style.width = px + 'px';
  img.style.height = (px * 462 / 1920) + 'px';
}
function mark(el) { btns.forEach(b => b.classList.toggle('on', b === el)); }
document.getElementById('b100').onclick = e => { setScale(1920); mark(e.target); };
document.getElementById('b50').onclick  = e => { setScale(1920 / 2); mark(e.target); };
document.getElementById('b25').onclick  = e => { setScale(1920 / 4); mark(e.target); };
document.getElementById('bfit').onclick = e => {
  const avail = document.getElementById('scroll').clientWidth - 22;
  setScale(Math.min(1920, avail)); mark(e.target);
};
window.addEventListener('resize', () => {
  if (document.getElementById('bfit').classList.contains('on')) setScale(
    Math.min(1920, document.getElementById('scroll').clientWidth - 22));
});
document.getElementById('bfit').click();
</script>
</body>
